function cardEl(c) {
  const m = c.mid && massById(c.mid), closed = c.st !== "open";
  let b = "", ok = true;
  if (c.type === "cancel") {
    b = `<div class="chg minus"><span class="s">−</span><b>Maša odpade</b><small>${fDay(m.date)}, ${fT(m.time)}, ${CH[m.church]}</small></div>
      ${closed ? (c.reason ? `<p class="wsum">»${esc(c.reason)}«</p>` : "") : `<label class="field"><span>Razlog na strani (ni obvezno)</span><input id="cr-${c.id}" data-card-f="reason" data-card="${c.id}" value="${esc(c.reason)}" placeholder="npr. Župnik je odsoten."></label>`}
      ${!closed && m.intents.length ? `<div class="q"><p>Maša ima namen ${pre(m.intents[0].kind)} ${esc(m.intents[0].text)}. Kaj naj bo z njim?</p><div class="chips"><button class="chip" data-act="cmove" data-card="${c.id}" data-v="next" aria-pressed="${c.move === "next"}">Prestavi na naslednjo mašo</button><button class="chip" data-act="cmove" data-card="${c.id}" data-v="keep" aria-pressed="${c.move === "keep"}">Pusti</button></div></div>` : ""}`;
    ok = !!c.move;
  } else if (c.type === "intent") {
    b = `<div class="chg"><span class="s">+</span><b>${pre(c.kind)} ${esc(c.text)}</b><small>${fDay(m.date)}, ${fT(m.time)}, ${CH[m.church]}</small></div>
      ${!closed && c.guess ? `<div class="q"><p>Sem prav razumel, da je za pokojnega?</p><div class="chips">${KINDS.map(([v, l]) => `<button class="chip" data-act="ckind" data-card="${c.id}" data-v="${v}" aria-pressed="${c.kind === v}">${l}</button>`).join("")}</div></div>` : ""}`;
  } else if (c.type === "group") {
    const g = S.verouk.find((x) => x.id === c.gid);
    b = `<div class="chg minus"><span class="s">−</span><b>Verouk ${g.name} odpade</b><small>${fDay(g.date)}, ${fT(g.time)}</small></div>${closed ? "" : `<label class="field"><span>Sporočilo staršem</span><input id="cr-${c.id}" data-card-f="msg" data-card="${c.id}" value="${esc(c.msg)}" placeholder="npr. Zaradi počitnic."></label>`}`;
  }
  const label = me().approval && c.type !== "group" ? "Pošlji v potrditev" : "Potrdi";
  return `<div class="card ${c.st === "done" ? "closed" : c.st === "gone" ? "gone" : ""}"><div class="card-h"><span class="eyebrow">${c.st === "done" ? "Shranjeno" : c.st === "gone" ? "Preklicano" : "Predlog"}</span>${closed ? "" : '<span class="pill line">še ni shranjeno</span>'}</div><div class="card-b">${b}</div>${closed ? "" : `<div class="card-f"><button class="btn primary" data-act="cok" data-card="${c.id}" ${ok ? "" : "disabled"}>${ok ? label : "Najprej izberite zgoraj"}</button><button class="btn ghost" data-act="cno" data-card="${c.id}">Prekliči</button></div>`}</div>`;
}
function chatPanel() {
  const n = S.chat.length, enterFrom = fx.msgs;

    const en = i >= enterFrom ? "enter" : "";
    if (m.who === "me") return `<div class="msg me ${en}">${esc(m.text)}</div>`;
    return `<div class="msg ai ${m.no ? "no" : ""} ${en}"><span class="by"><i></i>Pomočnik</span><p>${esc(m.text)}</p>${m.card ? cardEl(m.card) : ""}${m.sugg ? `<div class="chips">${m.sugg.map((s) => `<button class="chip" data-act="say" data-v="${esc(s)}">${esc(s)}</button>`).join("")}</div>` : ""}</div>`;
  }).join("") + (S.typing ? `<div class="msg ai"><span class="by"><i></i>Pomočnik</span><span class="typing"><i></i><i></i><i></i></span></div>` : "");
  fx.msgs = n;
  return `<div class="scrim ${fx.panel ? "enter" : ""}" data-act="chatclose"></div><section class="panel full ${fx.panel ? "enter" : ""}" role="dialog" aria-label="Pomočnik">

}

  let html = `<div class="shell">

      <nav class="nav" aria-label="Razdelki">${items.map((n) => `${n.r === "zgodovina" ? '<div class="sep"></div>' : ""}<a href="#${n.r}" data-act="nav" data-r="${n.r}" ${cur.r === n.r ? 'aria-current="page"' : ""}>${I(n.ic)}${n.label}${n.r === "domov" && ap ? `<span class="count">${ap}</span>` : ""}</a>`).join("")}</nav>
      <button class="me" data-act="profile"><span class="avatar ${u.owner ? "moss" : ""}">${u.short}</span><div><b>${esc(u.name)}</b><small>${esc(u.title)}</small></div></button></aside>
    <div class="mainwrap">
      <header class="phonebar"><span class="mark">${I("cross")}</span><b>${S.route === "domov" ? "Župnija Pirniče" : cur.label}</b><button class="avatar ${u.owner ? "moss" : ""}" data-act="profile" aria-label="Profil">${u.short}</button></header>
      <main class="scroll" id="scroll">${pageView()}</main>
      ${S.route === "nalaganje" ? "<div></div>" : `<div class="askbar"><div class="inner"><button class="ask" data-act="chat">${I("msg")}<span>Napišite, kaj naj spremenim …</span></button>${can("oznanila") ? `<button class="cam" data-act="photo" aria-label="Fotografiraj oznanila">${I("cam")}</button>` : ""}</div></div>`}
      <nav class="tabbar" aria-label="Razdelki">${tabs.map((n) => n.r === "_more" ? `<button data-act="more" ${!tabs.slice(0, 3).some((t) => t.r === cur.r) ? 'aria-current="page"' : ""}>${I(n.ic)}${n.label}</button>` : `<a href="#${n.r}" data-act="nav" data-r="${n.r}" ${cur.r === n.r ? 'aria-current="page"' : ""}>${I(n.ic)}${n.short || n.label}${n.r === "domov" && ap ? `<span class="dot">${ap}</span>` : ""}</a>`).join("")}</nav>
    </div></div>`;
  if (S.chatOpen) html += chatPanel();
  else if (S.panel) {
    const { type, id } = S.panel;
    html += type === "mass" ? pMass(massById(id)) : type === "intent" ? pIntent() : type === "event" ? pEvent(id) : type === "group" ? pGroup(id) : type === "person" ? pPerson(id) : type === "invite" ? pInvite() : type === "more" ? pMore() : pProfile();
  }
  if (S.toast) html += `<div class="toast ${fx.toast ? "enter" : ""}" role="status">${I("check")}<span>${esc(S.toast.text)}</span>${S.toast.undoable && S.history.length ? `<button data-act="undo">Razveljavi</button>` : ""}</div>`;
  return html;
}

// ── Prototype strip ──
const SCN = [["", "Skoči na …"], ["home", "Začetni zaslon"], ["empty", "Prazen teden"], ["reading", "Claude bere oznanila"], ["review", "Preverjanje negotovih mest"], ["error", "Lista ni mogoče prebrati"], ["approval", "Sprememba čaka župnika"], ["restricted", "Omejen pogled (katehistinja)"], ["login", "Prijava"]];
function bench() {
  return `<b>Prototip</b>
    <label>Prijavljen: <select id="b-user">${S.people.filter((p) => !p.invited).map((p) => `<option value="${p.id}" ${S.user === p.id ? "selected" : ""}>${esc(p.name)} · ${esc(p.title)}</option>`).join("")}</select></label>
    <label>Stanje: <select id="b-scn">${SCN.map(([v, l]) => `<option value="${v}">${l}</option>`).join("")}</select></label>
    <span class="bseg" role="group" aria-label="Zaslon"><button data-b="phone" data-v="0" aria-pressed="${!S.phone}">Računalnik</button><button data-b="phone" data-v="1" aria-pressed="${S.phone}">Telefon</button></span>
    <button class="reset" data-b="reset" title="Maše 26. 10.–1. 11. so iz oznanil za oktober 2026. Ostalo so primeri.">Ponastavi</button>`;
}
function scenario(v) {
  clearTimeout(readTimer); S.chatOpen = false; S.panel = null; S.loggedIn = true;
  if (v === "home") go("domov");
  if (v === "empty") { if (S.user === "ana") S.user = "blaz"; S.week = 1; S.view = "edit"; go("teden"); }
  if (v === "reading" || v === "review" || v === "error") {
    if (!can("oznanila")) S.user = "blaz";
    const file = v === "error" ? SAMPLES.blur : SAMPLES.photo;
    S.up = { stage: v === "reading" ? "reading" : v, file, picks: {}, fixing: {}, news: [...DRAFT_NEWS] }; go("nalaganje");
    if (v === "reading") readTimer = setTimeout(() => { if (S.up?.stage === "reading") { S.up.stage = "review"; fx.page = true; render(); } }, 4400);
  }
  if (v === "approval") { S.user = "blaz"; go("domov"); }
  if (v === "restricted") { S.user = "ana"; S.chat = []; go("domov"); }
  if (v === "login") { S.loggedIn = false; S.login = { stage: "form", email: "" }; }
  fx.page = true;
}

// ── Render ──
function render() {
  const keep = {}; for (const id of ["scroll", "thread"]) { const el = document.getElementById(id); if (el) keep[id] = el.scrollTop; }
  const ae = document.activeElement, focus = ae && ae.id && ae.tagName !== "BUTTON" ? { id: ae.id, v: ae.value, s: ae.selectionStart } : null;
  document.documentElement.classList.toggle("big", S.big);
  document.getElementById("bench").innerHTML = bench();
  document.getElementById("stage").className = "stage" + (S.phone ? " phone" : "");
  const app = document.getElementById("app");
  const routeChanged = lastRoute !== S.route; lastRoute = S.route;
  app.innerHTML = S.loggedIn ? shell() : vLogin();
  if (S.loggedIn && fx.page) document.querySelector(".page")?.classList.add("enter");
  const sc = document.getElementById("scroll"); if (sc) sc.scrollTop = routeChanged || fx.page ? 0 : keep.scroll || 0;
  const th = document.getElementById("thread"); if (th) th.scrollTop = th.scrollHeight;
  if (focus) { const el = document.getElementById(focus.id); if (el && "value" in el) { el.value = focus.v; el.focus(); try { el.setSelectionRange(focus.s, focus.s); } catch {} } }
  fx.page = false; fx.panel = false; fx.toast = false;
  bindDrop();
}
function bindDrop() {
  const d = document.getElementById("drop"); if (!d) return;
  d.ondragover = (e) => { e.preventDefault(); d.classList.add("over"); };
  d.ondragleave = () => d.classList.remove("over");
  d.ondrop = (e) => { e.preventDefault(); d.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) takeFile(f); };
}
function takeFile(f) {
  const meta = `${f.type.startsWith("image/") ? "Fotografija" : f.type === "application/pdf" ? "PDF" : "Tabela"} · ${Math.max(1, Math.round(f.size / 1024))} KB`;
  const file = { name: f.name, meta };
  if (f.type.startsWith("image/")) {
    const r = new FileReader(); r.onload = () => { file.url = r.result; startReading(file); render(); }; r.readAsDataURL(f);
  } else { startReading(file); render(); }
}

// ── Events ──
document.addEventListener("click", (e) => {
  const bb = e.target.closest("[data-b]");
  if (bb) {
    if (bb.dataset.b === "phone") S.phone = bb.dataset.v === "1";
    if (bb.dataset.b === "reset") { Object.assign(S, seed(), { history: [], chat: [], up: null, panel: null, chatOpen: false, week: 0, view: "edit", user: "blaz", loggedIn: true }); go("domov"); }
    return render();
  }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id, v = b.dataset.v;
  if (b.tagName === "A") e.preventDefault();
  const card = b.dataset.card && S.chat.map((m) => m.card).find((c) => c && c.id === b.dataset.card);
  const f = S.form;
  switch (act) {
    case "nav": go(b.dataset.r); break;
    case "nav-verouk": go("verouk"); break;
    case "nav-week": S.week = v === WEEKS[1] ? 1 : 0; S.view = "edit"; go("teden"); break;
    case "more": openPanel("more"); break;
    case "profile": openPanel("profile"); break;
    case "close": S.panel = null; break;
    case "noop": return;
    case "chat": S.chatOpen = true; S.panel = null; fx.panel = true; greet(); fx.msgs = S.chat.length; render(); document.getElementById("chat-in")?.focus(); return;
    case "chatclose": S.chatOpen = false; break;
    case "say": ask(v); return;
    case "cok": confirmCard(card); break;
    case "cno": card.st = "gone"; break;
    case "cmove": card.move = v; break;
    case "ckind": card.kind = v; break;
    case "mass": openPanel("mass", id); break;
    case "intent": openPanel("intent"); break;
    case "event": openPanel("event"); break;
    case "editevent": openPanel("event", id); break;
    case "group": openPanel("group", id); break;
    case "person": openPanel("person", id); break;
    case "invite": openPanel("invite"); break;
    case "fkind": f.kind = v; break;
    case "fmove": f.move = v; break;
    case "fcancel": f.cancel = v === "1"; break;
    case "addintent": if (!f.text.trim()) { document.getElementById("f-text")?.focus(); return; } A.addIntent(S.panel.id, f.text.trim(), f.kind); f.text = ""; break;
    case "rmintent": A.removeIntent(S.panel.id, id); break;
    case "docancel": A.cancelMass(S.panel.id, f.reason, f.move || "none"); S.panel = null; break;
    case "restore": A.restoreMass(id); break;
    case "saveintent": if (!f.text.trim()) { document.getElementById("f-text")?.focus(); return; } A.addIntent(f.mid, f.text.trim(), f.kind); S.panel = null; break;
    case "saveevent": if (!f.title.trim() || !f.date || !f.time) { document.getElementById(!f.title.trim() ? "f-title" : !f.date ? "f-date" : "f-time")?.focus(); return; } A.saveEvent(f, id || null); S.panel = null; break;
    case "delevent": A.deleteEvent(id); S.panel = null; break;
    case "docgroup": A.cancelGroup(id, f.msg); S.panel = null; break;
    case "grestore": A.restoreGroup(id); break;
    case "saveperson": A.savePerson(id, f); S.panel = null; break;
    case "rmperson": A.removePerson(id); S.panel = null; break;
    case "preset": f.title = v; f.sections = [...PRESETS[v]]; break;
    case "doinvite": A.invite(f); S.panel = null; break;
    case "ok": decide(id, true); break;
    case "no": decide(id, false); break;
    case "okall": decideAll(); break;
    case "undo": undo(); break;
    case "week": S.week = Number(v); break;
    case "view": S.view = v; break;
    case "photo": S.chatOpen = false; S.panel = null; document.getElementById("file-photo").click(); if (S.route !== "nalaganje" || S.up?.stage !== "pick") { S.up = { stage: "pick" }; go("nalaganje"); } break;
    case "choose": document.getElementById("file-any").click(); if (S.route !== "nalaganje") { S.up = { stage: "pick" }; go("nalaganje"); } break;
    case "sample": startReading(SAMPLES[v]); break;
    case "resume": go("nalaganje"); fx.page = true; break;
    case "manual": S.up = null; S.week = 1; S.view = "edit"; go("teden"); break;
    case "srctoggle": S.srcOpen = !S.srcOpen; break;
    case "flag": S.up.picks[b.dataset.k] = v; break;
    case "fixopen": { const r = DRAFT.find((x) => x.flag?.key === b.dataset.k); S.up.fixing[b.dataset.k] = r.flag.key === "name" ? r.text : r.flag.opts[0]; render(); document.getElementById(`fix-${b.dataset.k}`)?.focus(); return; }
    case "fixsave": { const k = b.dataset.k, val = (S.up.fixing[k] || "").trim(); if (!val) return; S.up.picks[k] = k === "time" ? (val.startsWith("17") ? "17.30" : "18.30") : val; delete S.up.fixing[k]; break; }
    case "addnews": S.up.news.push(""); render(); document.getElementById(`news-${S.up.news.length - 1}`)?.focus(); return;
    case "publish": S.up.news = S.up.news.filter((n) => n.trim()); publishUpload(); break;
    case "savedraft": { const bl = S.bulletins.find((x) => x.week === "2026-11-02"); bl.status = "draft"; go("oznanila"); toast("Osnutek je shranjen. Najdete ga pri Oznanilih."); break; }
    case "discard": { const bl = S.bulletins.find((x) => x.week === "2026-11-02"); if (bl.status === "draft") bl.status = "missing"; S.up = null; go("oznanila"); toast("Osnutek je zavržen. Nič ni bilo objavljeno."); break; }
    case "logout": S.loggedIn = false; S.panel = null; S.login = { stage: "form", email: "" }; break;
    case "magic": S.loggedIn = true; go("domov"); fx.page = true; break;
    case "loginback": S.login.stage = "form"; break;
  }
  render();
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.f) S.form[t.dataset.f] = t.type === "checkbox" ? t.checked : t.value;
  if (t.dataset.sec) { const s = new Set(S.form.sections); t.checked ? s.add(t.dataset.sec) : s.delete(t.dataset.sec); S.form.sections = Object.keys(SECTIONS).filter((k) => s.has(k)); }
  if (t.dataset.news != null) S.up.news[Number(t.dataset.news)] = t.value;
  if (t.dataset.fix) S.up.fixing[t.dataset.fix] = t.value;
  if (t.dataset.login) S.login.email = t.value;
  if (t.dataset.cardF) { const c = S.chat.map((m) => m.card).find((x) => x && x.id === t.dataset.card); if (c) c[t.dataset.cardF] = t.value; }
  if (S.panel?.type === "invite" && (t.dataset.f || t.dataset.sec)) { const btn = document.querySelector('[data-act="doinvite"]'); if (btn) btn.disabled = !S.form.name.trim() || !/@/.test(S.form.email) || !S.form.sections.length; }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "b-user") { S.user = t.value; S.chat = []; S.panel = null; S.chatOpen = false; S.loggedIn = true; if (!allowed(S.route)) go("domov"); fx.page = true; render(); }
  if (t.id === "b-scn") { scenario(t.value); render(); }
  if (t.dataset.actChange === "big") { S.big = t.checked; render(); }
  if (t.id === "file-photo" || t.id === "file-any") { const f = t.files[0]; t.value = ""; if (f) takeFile(f); }
  if (t.tagName === "SELECT" && t.dataset.f) S.form[t.dataset.f] = t.value;
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.dataset.form === "chat") { const ta = f.querySelector("textarea"), t = ta.value.trim(); if (!t) return; ta.value = ""; ask(t); }
  if (f.dataset.form === "login") { if (!/@/.test(S.login.email)) return; S.login.stage = "sent"; render(); }
});
document.addEventListener("keydown", (e) => {
  if (e.target.id === "chat-in" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); e.target.form.requestSubmit(); }
  if (e.target.dataset?.fix && e.key === "Enter") { e.preventDefault(); document.querySelector(`[data-act="fixsave"][data-k="${e.target.dataset.fix}"]`)?.click(); }
  if (e.key === "Escape" && (S.panel || S.chatOpen)) { S.panel = null; S.chatOpen = false; render(); }
});
window.addEventListener("hashchange", () => { const r = location.hash.slice(1); if (r && r !== S.route) { go(r); render(); } });

const start = location.hash.slice(1);
if (start) go(start);
render();
})();
</script>
</body>
</html>
