# check (lint, typecheck, tests, build) -> image -> deploy to t4a (+ Studio to sanity.studio), see docs/TECHNICAL.md "Deployment".
# Rollback: run by hand with `tag` = an older sha; that skips check and image.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Deploy this existing image tag (git sha) instead of building"
        required: false

env:
  IMAGE: ghcr.io/grega-rotar/zupnija-web
  # Repository variables (Settings → Secrets and variables → Actions → Variables).
  SITE_URL: ${{ vars.SITE_URL }}
  STUDIO_URL: ${{ vars.STUDIO_URL }}

jobs:
  check:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, studio]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: hnwav9pa
      NEXT_PUBLIC_SANITY_DATASET: production
    # Postgres for web's integration tests, same port and login as local development
    # (web/compose.dev.yml); the vitest global setup creates zupnija_test in it. Empty image = none for studio.
    services:
      postgres:
        image: ${{ matrix.app == 'web' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: zupnija
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: zupnija
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U zupnija -d zupnija"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - if: matrix.app == 'web'
        run: npm run typecheck
      - if: matrix.app != 'web'
        run: npx tsc --noEmit
      # Never spawns claude-pool: runClaude is mocked in tests (PRD, FR-9).
      - if: matrix.app == 'web'
        run: npm test
      - run: npm run build
        env:
          # src/db/index.ts needs it on import; nothing connects during the build.
          DATABASE_URL: postgres://build:build@127.0.0.1:1/build

  image:
    if: ${{ github.event_name != 'pull_request' && !inputs.tag }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/Dockerfile
          # NEXT_PUBLIC_* end up in the browser bundle, so they are baked in here, not read from .env.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
            NEXT_PUBLIC_SANITY_STUDIO_URL=${{ env.STUDIO_URL }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: ${{ github.event_name != 'pull_request' && !cancelled() && !failure() }}
    needs: image
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ inputs.tag || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Two merges close together: the older run can get the deploy slot last and roll main back.
      # So a push deploys only if it is still the newest main (a manual `tag` rollback always deploys).
      - name: Still the newest main?
        id: newest
        if: ${{ !inputs.tag }}
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main is at $head now, skipping the deploy of $GITHUB_SHA"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: SSH key
        if: steps.newest.outputs.stale != 'true'
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      - name: Copy compose.yml and the backup scripts
        if: steps.newest.outputs.stale != 'true'
        run: scp -r infra/compose.yml scripts deploy@${{ secrets.DEPLOY_HOST }}:/srv/zupnija/
      # The job's own token logs in for the pull (works while the GHCR package is private), in a
      # docker config of its own so the expired token never breaks other apps' pulls on the server.
      - name: Pull and restart
        if: steps.newest.outputs.stale != 'true'
        run: |
          ssh deploy@${{ secrets.DEPLOY_HOST }} "cd /srv/zupnija && export IMAGE_TAG=$TAG DOCKER_CONFIG=/srv/zupnija/.docker \
            && echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin \
            && docker compose pull && docker compose up -d --remove-orphans; rc=\$?; docker logout ghcr.io; docker image prune -af; exit \$rc"
      - name: Wait for the site and /api/health
        if: steps.newest.outputs.stale != 'true'
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 "$SITE_URL/api/health" && curl -fsS --max-time 5 -o /dev/null "$SITE_URL/"; then exit 0; fi
            sleep 2
          done
          echo "$SITE_URL did not come up within 60 s"
          exit 1

  # Studio is hosted by Sanity (<name>.sanity.studio), not on t4a. Off until the first
  # `npx sanity deploy` by hand has set deployment.appId in studio/sanity.cli.ts.
  studio:
    if: ${{ github.event_name == 'push' && vars.STUDIO_DEPLOY == 'true' }}
    needs: check
    runs-on: ubuntu-latest
    concurrency: studio
    defaults:
      run:
        working-directory: studio
    env:
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
      SANITY_STUDIO_PREVIEW_ORIGIN: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npx sanity deploy --yes
